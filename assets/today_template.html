<!DOCTYPE html>
<!--
  Layout de la « diapo du jour » nextevents (1920×1080) : affichée en
  direct pendant une rencontre à l'auditorium. Version sombre de la
  charte (encre #141414, texte #efeae6), composition centrée avec le
  sigle Champs Libres en filigrane — pas de visuel : titre,
  intervenants et leurs qualités, animateur.
  Rempli par nextevents/today.py via string.Template — variables :
    $font_regular/$font_medium  fontes Oldschool Grotesk (base64 woff2)
    $accent                     pastel de la card (pastille + filets)
    $bg                         fond sombre (choisi dans la webui)
    $light / $muted / $faint    texte principal / secondaire / discret
    $tag                        pastille catégorie (Rencontre/…)
    $h1_size                    taille du titre selon sa longueur
    $title                      titre (échappé HTML)
    $speakers_label             « Avec » (vide si pas d'intervenant)
    $speakers_html              blocs intervenant : nom + qualité
    $footer_html                pied de page : « animé par » + notes
                                + mentions d'accessibilité
                                (vide = aucun espace occupé)
    $logo_mark                  logo Champs Libres (SVG, currentColor)
-->
<html lang="fr"><head><meta charset="utf-8">
<style>
@font-face{font-family:'Oldschool Grotesk';font-weight:400;
 src:url(data:font/woff2;base64,$font_regular) format('woff2')}
@font-face{font-family:'Oldschool Grotesk';font-weight:500;
 src:url(data:font/woff2;base64,$font_medium) format('woff2')}
*{margin:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden}
body{font-family:'Oldschool Grotesk',Arial,sans-serif;color:$light;
 background:#000;display:flex;flex-direction:column}
.card{position:relative;flex:1;background:$bg;border-radius:72px;
 overflow:hidden;display:flex;flex-direction:column;align-items:center;
 text-align:center;padding:64px 90px 100px}
.watermark{position:absolute;color:rgba(239,234,230,.05)}
.watermark svg{display:block;width:820px;height:820px}
.watermark--tr{top:-260px;right:-260px}
.watermark--bl{bottom:-260px;left:-260px}
.tag{align-self:flex-start;background:$accent;color:#141414;
 border-radius:2em;padding:12px 36px;font-size:30px;font-weight:500}
h1{font-size:80px;font-weight:500;line-height:1.08;letter-spacing:-.01em;
 margin-top:36px;max-width:1700px;text-wrap:balance;display:-webkit-box;
 -webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.rule{height:3px;background:$accent;border-radius:2px;margin-top:44px;
 width:180px}
.middle{flex:1;display:flex;flex-direction:column;align-items:center;
 justify-content:center;min-height:0}
.spk-label{font-size:26px;font-weight:500;
 letter-spacing:.14em;text-transform:uppercase;color:$muted}
.speakers{margin-top:26px;display:flex;flex-direction:column;gap:32px;
 align-items:center;min-height:0;overflow:hidden}
.speaker{display:flex;flex-direction:column;gap:2px;align-items:center}
.speaker .name{font-size:54px;font-weight:500}
.speaker .qual{font-size:32px;line-height:1.3;color:$muted;
 max-width:1400px}
.mod{margin-top:auto;padding-top:34px;font-size:34px;color:$faint;
 border-top:1px solid rgba(239,234,230,.12);width:100%}
.mod-line b{font-weight:500;color:$light}
.note-line{margin-top:10px;font-size:24px;color:$muted}
.access-line{margin-top:10px;font-size:24px;color:$faint}
.access-line::before{content:"◦ "}
.attrib{position:absolute;right:44px;bottom:30px;font-size:19px;
 color:rgba(239,234,230,.4);display:flex;align-items:center;gap:10px}
.attrib svg{height:26px;width:auto}
</style></head><body>
<div class="card">
  <div class="watermark watermark--tr">$logo_mark</div>
  <div class="watermark watermark--bl">$logo_mark</div>
  <span class="tag">$tag</span>
  <h1 style="font-size:${h1_size}px">$title</h1>
  <div class="rule"></div>
  <div class="middle">
    <div class="spk-label">$speakers_label</div>
    <div class="speakers">$speakers_html</div>
  </div>
  $footer_html
  <div class="attrib">$logo_mark © Les Champs Libres — leschampslibres.fr — CC BY-SA</div>
</div>
</body></html>
