<!DOCTYPE html>
<!--
  Player plein écran des diapos HTML générées (OBS : Browser Source).
  /slideshow = paysage, /slideshow/portrait = portrait.
  La liste et les réglages (intervalle, transition) sont re-lus en
  continu via /api/slide-list — une régénération se reflète seule.
  Overrides possibles en query : ?delay=6&transition=none|fade|slide
-->
<html lang="fr"><head><meta charset="utf-8"><title>Slideshow</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
.slide{position:absolute;inset:0}
.slide iframe{width:100%;height:100%;border:0;transform-origin:0 0}
#empty{position:absolute;inset:0;z-index:10;display:none;
 place-items:center;color:#8f8c8a;font:28px sans-serif}
#paused{position:absolute;right:18px;bottom:14px;z-index:10;
 display:none;color:rgba(239,234,230,.5);font:18px sans-serif;
 background:rgba(0,0,0,.35);padding:6px 12px;border-radius:50%}
</style></head><body>
<div id="empty">aucune diapo</div>
<div id="paused">⏸</div>
<script>
const P = new URLSearchParams(location.search);
const layout = P.get('layout')
  || (location.pathname.endsWith('/portrait') ? 'portrait' : '');
const qDelay = parseFloat(P.get('delay') || '');
const qTrans = P.get('transition') || '';
const qTdur = parseInt(P.get('tdur') || '');

let slides = [], idx = -1, cur = null, timer = null, hideT = null;
let delay = 8, trans = 'fade', dur = 1500, paused = false;

function fit(f) {
  const d = f.contentDocument;
  // largeur/hauteur CSS fixes du gabarit — scrollWidth retournerait la
  // taille du viewport si elle dépasse le contenu (ex. portrait 1240
  // dans une fenêtre paysage 1920) → slide décentrée
  const cs = f.contentWindow.getComputedStyle(d.documentElement);
  const w = parseFloat(cs.width) || d.documentElement.scrollWidth || 1920;
  const h = parseFloat(cs.height) || d.documentElement.scrollHeight || 1080;
  const s = Math.min(innerWidth / w, innerHeight / h);
  f.style.width = w + 'px';
  f.style.height = h + 'px';
  f.style.transform =
    `translate(${(innerWidth - w * s) / 2}px,` +
    `${(innerHeight - h * s) / 2}px) scale(${s})`;
}

function show(name) {
  const wrap = document.createElement('div');
  wrap.className = 'slide';
  const f = document.createElement('iframe');
  f.src = '/slides/' + (layout ? layout + '/' : '') + 'html/' + name;
  f.onload = () => {
    fit(f);
    // les clics/frappes dans l'iframe ne remontent pas au parent :
    // on les re-écoute dans le document de la diapo (même origine)
    const w = f.contentWindow;
    w.addEventListener('click', togglePause);
    w.addEventListener('mousemove', showBadge);
    w.addEventListener('keydown', e => {
      if (e.code === 'Space') { e.preventDefault(); togglePause(); }
    });
  };
  wrap.appendChild(f);
  document.body.appendChild(wrap);
  const old = cur;
  // reflow forcé : sans lui le style initial n'est pas commité et le
  // navigateur saute la transition (swap instantané au lieu du fondu)
  if (old && trans === 'fade') {
    wrap.style.opacity = 0;
    wrap.getBoundingClientRect();
    wrap.style.transition = `opacity ${dur}ms`;
    wrap.style.opacity = 1;
    old.style.transition = `opacity ${dur}ms`;
    old.style.opacity = 0;
    setTimeout(() => old.remove(), dur + 100);
  } else if (old && trans === 'slide') {
    wrap.style.transform = 'translateX(100%)';
    wrap.getBoundingClientRect();
    wrap.style.transition = `transform ${dur}ms`;
    wrap.style.transform = 'translateX(0)';
    old.style.transition = `transform ${dur}ms`;
    old.style.transform = 'translateX(-100%)';
    setTimeout(() => old.remove(), dur + 100);
  } else if (old) {
    old.remove();
  }
  cur = wrap;
}

function next() {
  if (!slides.length) return;
  idx = (idx + 1) % slides.length;
  show(slides[idx]);
  arm();
}

function arm() {
  clearTimeout(timer);
  if (!paused)
    timer = setTimeout(next, Math.max(2, delay) * 1000);
}

// badge « pause » façon lecteur vidéo : visible à la mise en pause et
// au moindre mouvement de souris, masqué après ~2 s d'inactivité
function showBadge() {
  if (!paused) return;
  const b = document.getElementById('paused');
  b.style.display = 'block';
  clearTimeout(hideT);
  hideT = setTimeout(() => b.style.display = 'none', 1800);
}

function togglePause() {
  paused = !paused;
  const b = document.getElementById('paused');
  if (paused) {
    clearTimeout(timer);
    showBadge();
  } else {
    clearTimeout(hideT);
    b.style.display = 'none';
    arm();
  }
}

async function poll() {
  try {
    const r = await (await fetch(
      '/api/slide-list?layout=' + layout)).json();
    // ?? et non || : un réglage 0 explicite doit être respecté
    delay = qDelay || (r.delay ?? 8);
    trans = qTrans || r.transition || 'fade';
    dur = qTdur || (r.tdur ?? 1500);
    const changed = JSON.stringify(r.slides) !== JSON.stringify(slides);
    const curName = idx >= 0 ? slides[idx] : null;
    slides = r.slides;
    document.getElementById('empty').style.display =
      slides.length ? 'none' : 'grid';
    if (changed && (!slides.length || !slides.includes(curName))) {
      // diapo courante supprimée : repartir proprement
      idx = -1;
      next();
    }
    if (idx < 0 && slides.length) next();
  } catch (e) { /* serveur coupé : on réessaiera */ }
}

addEventListener('click', togglePause);
addEventListener('mousemove', showBadge);
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); togglePause(); }
});
setInterval(poll, 15000);
poll();
addEventListener('resize',
  () => cur && fit(cur.querySelector('iframe')));
</script>
</body></html>
