# Déploiement serveur : image publiée par CI (ghcr.io) — pas de build
# local. Mise à jour : ./update.sh  (ou docker compose pull && up -d)
services:
  nextevents:
    image: ghcr.io/dewiweb/nextevents:latest
    container_name: nextevents
    restart: unless-stopped
    ports:
      - "8095:8080"
    environment:
      TZ: Europe/Paris
    volumes:
      # diapos générées + settings.json — persistent entre les recreates
      - ./data:/data
